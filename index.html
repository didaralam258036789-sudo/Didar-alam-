 {t:"CD যোগ করি।",e:[SG(C,D,"c")]},

tri_diff2:{n:"ভূমি, ভূমি-সংলগ্ন কোণ ও অপর দুই বাহুর অন্তর দেওয়া ত্রিভুজ (AC > AB)",f:[["a","ভূমি BC (সেমি)",5],["be","ভূমি-সংলগ্ন কোণ ∠B (ডিগ্রি)",60],["d","AC − AB (সেমি)",2]],b(p){const{a,be,d}=p;if(!(a>0&&d>0&&be>0&&be<180))throw Error("মাপ ঠিক নয়: সব মাপ শূন্যের চেয়ে বড় এবং কোণ ০° থেকে ১৮০°-এর মধ্যে হতে হবে");const r=be*D2R;if(!(d<a&&d+a*Math.cos(r)>0))throw Error("এই মাপে ত্রিভুজ হয় না: অন্তর ভূমির চেয়ে ছোট হতে হবে (কোণ খুব বড় হলেও হয় না)");
 const B=[0,0],C=[a,0],y=(a*a-d*d)/(2*(d+a*Math.cos(r))),A=pol(B,y,r),D=pol(B,d,r+Math.PI),M=mid(C,D);

 {t:`একটি রেখাংশ BC = ${nn(a)} সেমি আঁকি।`,e:[SG(B,C,"m"),PT(B,"B"),PT(C,"C")]},

 {t:"CD যোগ করি।",e:[SG(C,D,"c")]},
 {t:"CD-এর লম্বদ্বিখণ্ডক আঁকি, যা BX রশ্মিকে A বিন্দুতে ছেদ করে।",why:"লম্বদ্বিখণ্ডকের ওপরের বিন্দু C ও D থেকে সমান দূরে থাকে, তাই AC = AD হবে।",e:[SG(M,A,"c"),RA(M,unit(M,D),unit(M,A)),PT(A,"A")]},

tri_perim:{n:"ভূমি-সংলগ্ন দুটি কোণ ও পরিসীমা দেওয়া ত্রিভুজ",f:[["be","∠B (ডিগ্রি)",60],["g","∠C (ডিগ্রি)",50],["p","পরিসীমা AB + BC + CA (সেমি)",14]],b(p){const be=p.be,g=p.g,L=p.p;if(!(be>0&&g>0&&L>0))throw Error("মাপ শূন্যের চেয়ে বড় হতে হবে");if(be+g>=180)throw Error("দুই কোণের যোগফল ১৮০°-এর কম হতে হবে");
 const P=[0,0],Q=[L,0],h1=be*D2R/2,h2=g*D2R/2,k=Math.sin(h1+h2),AP=L*Math.sin(h2)/k,AQ=L*Math.sin(h1)/k,A=pol(P,AP,h1),B=[AP/2/Math.cos(h1),0],C=[L-AQ/2/Math.cos(h2),0],M1=mid(A,P),M2=mid(A,Q);
 return{given:`ত্রিভুজ ABC-এর ∠B = ${nn(be)}°, ∠C = ${nn(g)}° এবং পরিসীমা AB + BC + CA = ${nn(L)} সেমি।`,steps:[

 {t:`Q বিন্দুতে QP-এর সাথে ∠C-এর অর্ধেক, অর্থাৎ ${nn(g/2)}° কোণ করে QY রশ্মি আঁকি। PX ও QY রশ্মি A বিন্দুতে ছেদ করে।`,e:[SG(Q,pol(Q,AQ*1.2,Math.PI-h2),"d"),AM(Q,Math.PI-h2,Math.PI,nn(g/2)+"°"),PT(A,"A")]},
 {t:"AP-এর লম্বদ্বিখণ্ডক আঁকি, যা PQ-কে B বিন্দুতে ছেদ করে।",why:"তাহলে BA = BP হবে।",e:[SG(M1,B,"c"),RA(M1,unit(M1,A),unit(M1,B)),PT(B,"B")]},
 {t:"AQ-এর লম্বদ্বিখণ্ডক আঁকি, যা PQ-কে C বিন্দুতে ছেদ করে।",why:"তাহলে CA = CQ হবে।",e:[SG(M2,C,"c"),RA(M2,unit(M2,A),unit(M2,C)),PT(C,"C")]},
 {t:"AB ও AC যোগ করি। ABC-ই নির্ণেয় ত্রিভুজ।",e:[SG(A,B,"m"),SG(A,C,"m"),SG(B,C,"m")]}],proof:`B বিন্দু AP-এর লম্বদ্বিখণ্ডকের ওপর, তাই BA = BP এবং ∠BAP = ∠BPA = ${nn(be/2)}°। বহিঃস্থ কোণ ∠ABC = ∠BAP + ∠BPA = ${nn(be)}°। একইভাবে CA = CQ এবং ∠ACB = ${nn(g)}°। অতএব AB + BC + CA = PB + BC + CQ = PQ = ${nn(L)} সেমি।`}}},

parallel:{n:"রেখার বাইরের বিন্দু দিয়ে সমান্তরাল রেখা",f:[["d","বিন্দু থেকে রেখার দূরত্ব (সেমি)",2]],b(p){const d=p.d;if(!(d>0))throw Error("মাপ শূন্যের চেয়ে বড় হতে হবে");const Q=[0,0],P=[1,d],r=Math.hypot(1,d),R=[r,0],S=[1+r,d];return{given:`l সরলরেখা এবং এর বাইরে P বিন্দু। P দিয়ে l-এর সমান্তরাল রেখা আঁকতে হবে।`,steps:[

 try{if(!pr||!Array.isArray(pr.steps)||!pr.steps.length)throw Error("প্রোগ্রামে ধাপ নেই");
 pr.steps.slice(0,16).forEach(s=>{const E=[];(s.ops||[]).forEach(o=>{
  if(mk.has(o.op)&&!/^[A-Z][A-Za-z0-9_]*$/.test(String(o.n)))throw Error("বিন্দুর নাম ঠিক নয়: "+o.n);

  case"pbis":{const a=get(o.a),b=get(o.b),m=mid(a,b);P[o.n]=[m[0]-.6*(b[1]-a[1]),m[1]+.6*(b[0]-a[0])];break}

 if(!best){$("abox").innerHTML='<div class="c">সমাধান তৈরি করা যায়নি'+(lastErr&&lastErr!="json"?" ("+e(lastErr)+")":"")+'। প্রশ্নটি আরও স্পষ্ট করে (সব সংখ্যাসহ) লিখে আবার চেষ্টা করুন। বারবার হলে Supabase-এর hyper-handler ফাংশন নতুন কোডে আপডেট করা আছে কিনা দেখুন।</div>';return}
 AC=best;AS=0;AA=null;AALL=false;accShow()}
function accShow(){const R=AC;if(!R||!$("abox"))return;const n=R.steps.length,sh=new Set(),s=R.steps[AS],bad=R.checks.filter(c=>!c.ok);R.steps.forEach((st,i)=>{if(AALL||i<=AS)st.blocks.forEach(x=>sh.add(x))});

 <div class="row" style="margin-top:8px"><button class="g" onclick="aGo(-1)">⬅ আগের</button><button class="g" onclick="aGo(1)">পরের ➡</button></div>
 <label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" style="width:auto" ${AALL?"checked":""} onchange="AALL=this.checked;accShow()">সব ধাপের লেখা একসাথে দেখান</label></div>
 ${[...sh].sort((a,b)=>a-b).map(i=>`<div class="nbp" id="ab${i}">${R.blocks[i].html}</div>`).join("")}

 <div class="c"><b>❓ বুঝতে পারোনি?</b><div class="mu">প্রশ্ন করলে শিক্ষিকা থামবেন, উত্তরের পর এই ধাপ থেকে আবার চলবে।</div><input id="aqq" placeholder="প্রশ্ন লিখুন বা মাইক চাপুন"><div class="row" style="margin-top:8px"><button class="g" id="amic" onclick="aMic()">🎙️ বলে প্রশ্ন</button><button onclick="aAsk()">পাঠান</button></div>${AA?`<div class="m" style="margin-top:10px"><div class="mu">প্রশ্ন: ${e(AA.q)}</div><div style="white-space:pre-wrap">${e(AA.a)}</div></div>`:""}</div>`}
function aPlay(){AP=true;AW=false;accShow();aStep()}
function aPause(){AP=false;AW=false;stopSpeak();accShow()}
function aStep(){if(!AP)return;const s=AC.steps[AS];say(s.t+(s.why?" কারণ, "+s.why:""),()=>{if(!AP)return;setTimeout(()=>{if(!AP)return;if(AS<AC.steps.length-1){AS++;accShow();aStep()}else{AP=false;accShow();say("সমাধান সম্পূর্ণ। এবার খাতায় ঘর কেটে লিখে নাও।")}},600)})}
